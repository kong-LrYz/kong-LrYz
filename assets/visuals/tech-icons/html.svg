<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="80" height="80"><title>HTML</title><style>
          /* The lateral tilt uses the Animate.css swing keyframes. */
          @keyframes swing {
            0%, 100% { transform: rotate(0); }
            20% { transform: rotate(15deg); }
            40% { transform: rotate(-10deg); }
            60% { transform: rotate(5deg); }
            80% { transform: rotate(-5deg); }
          }
          @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            45% { transform: translate(7px, -13px); }
            70% { transform: translate(-5px, -4px); }
          }
          @keyframes tilt {
            0%, 100% { transform: skewY(0deg); }
            40% { transform: skewY(-11deg); }
            70% { transform: skewY(7deg); }
          }
          .glyph { transform-box: fill-box; transform-origin: center; }
          @media (prefers-reduced-motion: reduce) { .glyph { animation: none !important; } }
        </style><svg width="256" height="256" fill="none" viewBox="0 0 256 256"><rect width="256" height="256" fill="#E14E1D" rx="60" /><g class="glyph" style="animation:tilt 3.9s -1.25s ease-in-out infinite"><path fill="#fff" d="M48 38L56.6098 134.593H167.32L163.605 176.023L127.959 185.661L92.38 176.037L90.0012 149.435H57.9389L62.5236 200.716L127.951 218.888L193.461 200.716L202.244 102.655H85.8241L82.901 69.9448H205.041H205.139L208 38H48Z" /><path fill="#EBEBEB" d="M128 38H48L56.6098 134.593H128V102.655H85.8241L82.901 69.9448H128V38Z" /><path fill="#EBEBEB" d="M128 185.647L127.959 185.661L92.38 176.037L90.0012 149.435H57.9388L62.5236 200.716L127.951 218.888L128 218.874V185.647Z" /></g></svg>
