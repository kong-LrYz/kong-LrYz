name: Refresh contribution snake

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Generate the contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            rendered/snake-light.svg?palette=github-light&color_snake=%23017782
            rendered/snake-dark.svg?palette=github-dark&color_snake=%2365e5d1

      - name: Respect reduced motion in the contribution snake
        shell: bash
        run: |
          sed -i 's|</style>|@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>|' rendered/snake-{light,dark}.svg

      - name: Store the generated SVGs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: profile-visuals
          path: rendered/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: generate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: profile-visuals
          path: ${{ runner.temp }}/profile-visuals

      - name: Publish the contribution snake
        shell: bash
        run: |
          for mode in light dark; do
            cp "$RUNNER_TEMP/profile-visuals/snake-$mode.svg" "assets/visuals/snake-$mode.svg"
          done

          git add -- assets/visuals/snake-{light,dark}.svg
          if git diff --cached --quiet; then
            echo "The contribution snake is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Refresh contribution snake"
          git push origin HEAD
