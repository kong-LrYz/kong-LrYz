name: Refresh GitHub cards and contribution snake

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-account-totals]
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-activity.yml"
      - ".github/publish_visuals.py"
      - ".github/stats-renderer/**"
      - ".github/account-totals.json"

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name != 'repository_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the latest GitHub activity and public statistics
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          query='query($owner: String!) {
            user(login: $owner) {
              login
              name
              followers { totalCount }
              pullRequests { totalCount }
              issues { totalCount }
              repositories(first: 100, privacy: PUBLIC, ownerAffiliations: OWNER) {
                totalCount
                nodes { stargazerCount }
              }
              repositoriesContributedTo(includeUserRepositories: false) { totalCount }
              contributionsCollection {
                restrictedContributionsCount
                totalPullRequestReviewContributions
                contributionCalendar { weeks { contributionDays { date contributionCount } } }
              }
            }
          }'
          data=$(gh api graphql -f query="$query" -f owner="$PROFILE_OWNER" --jq '.data.user')
          mkdir -p rendered
          printf '%s\n' "$data" > "$RUNNER_TEMP/profile-public-stats.json"
          python3 - <<'PYTHON'
          from pathlib import Path
          import json
          import os

          if os.environ["GITHUB_EVENT_NAME"] == "repository_dispatch":
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              totals = event["client_payload"]
          else:
              totals = json.loads(Path(".github/account-totals.json").read_text())

          for key in ("commits", "prs"):
              if type(totals.get(key)) is not int or not 0 <= totals[key] < 2**53:
                  raise ValueError(f"Invalid {key} count")
          Path("rendered/account-totals.json").write_text(
              json.dumps({key: totals[key] for key in ("commits", "prs")}, indent=2) + "\n"
          )
          PYTHON
          printf '%s\n' "$(TZ=Asia/Hong_Kong date +%F)" "$data" "$(cat rendered/account-totals.json)" \
            | sha256sum | cut -d' ' -f1 > rendered/profile-fingerprint.txt

          if [[ "$GITHUB_EVENT_NAME" == schedule ]] && cmp -s .github/profile-fingerprint.txt rendered/profile-fingerprint.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the contribution snake
        if: steps.probe.outputs.changed == 'true'
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            rendered/snake-light.svg?palette=github-light&color_snake=%23017782
            rendered/snake-dark.svg?palette=github-dark&color_snake=%2365e5d1

      - name: Respect reduced motion in the contribution snake
        if: steps.probe.outputs.changed == 'true'
        shell: bash
        run: |
          sed -i 's|</style>|@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>|' rendered/snake-{light,dark}.svg

      - name: Generate the contribution streak in light mode
        if: steps.probe.outputs.changed == 'true'
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1
        with:
          options: user=${{ github.repository_owner }}&theme=default&timezone=Asia%2FHong_Kong&hide_border=true&background=00000000&ring=1a7f37&fire=0969da&dates=1a7f37&stroke=2da44e
          path: rendered/contribution-streak-light.svg

      - name: Generate the contribution streak in dark mode
        if: steps.probe.outputs.changed == 'true'
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1
        with:
          options: user=${{ github.repository_owner }}&theme=github-dark&timezone=Asia%2FHong_Kong&hide_border=true&background=00000000&ring=2fcb4e&fire=1f6feb&dates=39d353&stroke=238636
          path: rendered/contribution-streak-dark.svg

      - name: Set up Node for the stats renderer
        if: steps.probe.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Render GitHub stats with the account totals
        if: steps.probe.outputs.changed == 'true'
        shell: bash
        run: |
          npm ci --prefix .github/stats-renderer --ignore-scripts --no-audit --no-fund
          node .github/stats-renderer/render.mjs "$RUNNER_TEMP/profile-public-stats.json" rendered/account-totals.json rendered

      - name: Check both cards contain the expected data sections
        if: steps.probe.outputs.changed == 'true'
        shell: bash
        run: |
          for mode in light dark; do
            grep -q 'Longest Streak' "rendered/contribution-streak-$mode.svg"
            grep -q 'Total Commits' "rendered/github-stats-$mode.svg"
            grep -q 'Total PRs' "rendered/github-stats-$mode.svg"
          done

      - name: Store the generated SVGs
        if: steps.probe.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: profile-visuals
          path: |
            rendered/*.svg
            rendered/profile-fingerprint.txt
            rendered/account-totals.json
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: profile-visuals
          path: ${{ runner.temp }}/profile-visuals

      - name: Publish the generated profile images
        shell: bash
        run: |
          python3 .github/publish_visuals.py "$RUNNER_TEMP/profile-visuals"
          git add -A -- README.md assets/visuals .github/profile-fingerprint.txt .github/account-totals.json

          if git diff --cached --quiet; then
            echo "The profile images are already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Refresh GitHub cards and contribution snake"
          git push origin HEAD
