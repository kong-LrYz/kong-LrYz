name: Refresh profile visuals

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      LIGHT_CARD: bg_color=f5fafb&title_color=15596b&text_color=365062&border_color=cbdbdf&icon_color=157f78
      DARK_CARD: bg_color=101a22&title_color=85ddeb&text_color=b3c2d2&border_color=314554&icon_color=59d5bf
    steps:
      - name: Generate the contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            rendered/snake-light.svg?palette=github-light&color_snake=%23017782
            rendered/snake-dark.svg?palette=github-dark&color_snake=%2365e5d1

      - name: Respect reduced motion in the contribution snake
        shell: bash
        run: |
          sed -i 's|</style>|@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>|' rendered/snake-{light,dark}.svg

      - name: Generate the BOSS assistant card in light mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: repo=boss-agent-assistant&${{ env.LIGHT_CARD }}
          path: rendered/boss-light.svg
          core_version: "2.3.1"
          fail_on_error: "true"

      - name: Generate the BOSS assistant card in dark mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: repo=boss-agent-assistant&${{ env.DARK_CARD }}
          path: rendered/boss-dark.svg
          core_version: "2.3.1"
          fail_on_error: "true"

      - name: Generate the Tree-sitter card in light mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: repo=tree-sitter-isabelle&${{ env.LIGHT_CARD }}
          path: rendered/parser-light.svg
          core_version: "2.3.1"
          fail_on_error: "true"

      - name: Generate the Tree-sitter card in dark mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: repo=tree-sitter-isabelle&${{ env.DARK_CARD }}
          path: rendered/parser-dark.svg
          core_version: "2.3.1"
          fail_on_error: "true"

      - name: Store the generated SVGs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: profile-visuals
          path: rendered/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: generate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: profile-visuals
          path: ${{ runner.temp }}/profile-visuals

      - name: Update the public repository list and publish the SVGs
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          gh api --paginate --slurp "users/$PROFILE_OWNER/repos?type=owner&per_page=100" \
            | python3 .github/refresh_activity.py "$PROFILE_OWNER"

          for widget in snake boss parser; do
            for mode in light dark; do
              asset="$widget-$mode.svg"
              cp "$RUNNER_TEMP/profile-visuals/$asset" "assets/visuals/$asset"
            done
          done

          git add -- README.md assets/visuals
          if git diff --cached --quiet; then
            echo "Profile visuals and activity are already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Refresh profile visuals and activity"
          git push origin HEAD
