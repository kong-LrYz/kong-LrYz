name: Refresh profile activity

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Read public pushes and update the profile
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          gh api --paginate --slurp "users/$PROFILE_OWNER/repos?type=owner&per_page=100" \
            | python3 .github/refresh_activity.py "$PROFILE_OWNER"

      - name: Render the animation from GitHub's public contribution calendar
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          python3 -m venv "$RUNNER_TEMP/reactor"
          "$RUNNER_TEMP/reactor/bin/python" -m pip install --disable-pip-version-check 'Pillow==13.0.0'
          "$RUNNER_TEMP/reactor/bin/python" .github/render_reactor.py "$PROFILE_OWNER" assets

      - name: Publish when the activity changes
        shell: bash
        run: |
          paths=(README.md assets/reactor.webp assets/reactor-motion.webp)
          if git diff --quiet -- "${paths[@]}"; then
            echo "Profile activity is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Refresh public contribution animation and activity" -- "${paths[@]}"
          git push origin HEAD
