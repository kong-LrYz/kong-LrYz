name: Refresh GitHub cards and contribution snake

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-activity.yml"
      - ".github/publish_visuals.py"

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the latest GitHub activity and public statistics
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          query='query($owner: String!) {
            user(login: $owner) {
              name
              followers { totalCount }
              pullRequests { totalCount }
              issues { totalCount }
              repositories(first: 100, privacy: PUBLIC, ownerAffiliations: OWNER) {
                totalCount
                nodes { stargazerCount }
              }
              repositoriesContributedTo { totalCount }
              contributionsCollection {
                restrictedContributionsCount
                totalPullRequestReviewContributions
                contributionCalendar { weeks { contributionDays { date contributionCount } } }
              }
            }
          }'
          data=$(gh api graphql -f query="$query" -f owner="$PROFILE_OWNER" --jq '.data.user')
          commits=$(gh api --method GET search/commits \
            -f q="author:$PROFILE_OWNER is:public" -F per_page=1 \
            --jq 'if .incomplete_results then error("Incomplete commit count") else .total_count end')
          mkdir -p rendered
          printf '%s\n' "$(TZ=Asia/Hong_Kong date +%F)" "$data" "$commits" \
            | sha256sum | cut -d' ' -f1 > rendered/profile-fingerprint.txt

          if [[ "$GITHUB_EVENT_NAME" == schedule ]] && cmp -s .github/profile-fingerprint.txt rendered/profile-fingerprint.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the contribution snake
        if: steps.probe.outputs.changed == 'true'
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            rendered/snake-light.svg?palette=github-light&color_snake=%23017782
            rendered/snake-dark.svg?palette=github-dark&color_snake=%2365e5d1

      - name: Respect reduced motion in the contribution snake
        if: steps.probe.outputs.changed == 'true'
        shell: bash
        run: |
          sed -i 's|</style>|@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>|' rendered/snake-{light,dark}.svg

      - name: Generate the contribution streak in light mode
        if: steps.probe.outputs.changed == 'true'
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1
        with:
          options: user=${{ github.repository_owner }}&theme=default&timezone=Asia%2FHong_Kong&hide_border=true&background=00000000&ring=1a7f37&fire=0969da&dates=1a7f37&stroke=2da44e
          path: rendered/contribution-streak-light.svg

      - name: Generate the contribution streak in dark mode
        if: steps.probe.outputs.changed == 'true'
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1
        with:
          options: user=${{ github.repository_owner }}&theme=github-dark&timezone=Asia%2FHong_Kong&hide_border=true&background=00000000&ring=2fcb4e&fire=1f6feb&dates=39d353&stroke=238636
          path: rendered/contribution-streak-dark.svg

      - name: Generate GitHub stats in light mode
        if: steps.probe.outputs.changed == 'true'
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: show_icons=true&include_all_commits=true&hide_border=true&theme=default&bg_color=00000000
          path: rendered/github-stats-light.svg
          core_version: "2.3.1"
          fail_on_error: "true"

      - name: Generate GitHub stats in dark mode
        if: steps.probe.outputs.changed == 'true'
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: show_icons=true&include_all_commits=true&hide_border=true&theme=github_dark&bg_color=00000000
          path: rendered/github-stats-dark.svg
          core_version: "2.3.1"
          fail_on_error: "true"

      - name: Check both cards contain the expected data sections
        if: steps.probe.outputs.changed == 'true'
        shell: bash
        run: |
          for mode in light dark; do
            grep -q 'Longest Streak' "rendered/contribution-streak-$mode.svg"
            grep -q 'Total Commits' "rendered/github-stats-$mode.svg"
            sed -i 's/Total Commits/Public Commits/g' "rendered/github-stats-$mode.svg"
          done

      - name: Store the generated SVGs
        if: steps.probe.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: profile-visuals
          path: |
            rendered/*.svg
            rendered/profile-fingerprint.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: profile-visuals
          path: ${{ runner.temp }}/profile-visuals

      - name: Publish the generated profile images
        shell: bash
        run: |
          python3 .github/publish_visuals.py "$RUNNER_TEMP/profile-visuals"
          git add -A -- README.md assets/visuals .github/profile-fingerprint.txt

          if git diff --cached --quiet; then
            echo "The profile images are already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Refresh GitHub cards and contribution snake"
          git push origin HEAD
